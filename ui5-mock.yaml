specVersion: "3.0"
metadata:
  name: tasktwo
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /V2/OData/OData.svc
            metadataPath: ./webapp/localService/metadataV2.xml
            mockdataPath: ./webapp/localService/data
            generateMockData: true
          - urlPath: /V4/OData/OData.svc
            metadataPath: ./webapp/localService/metadataV4.xml
            mockdataPath: ./webapp/localService/data
            generateMockData: true
        annotations: []
